[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "youtube-music-library-radio"
version = "0.1.0"
description = "Stream the owner's YouTube Music library to a Sonos speaker as an endless radio station."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [ { name = "J Rob Gant", email = "rgant@alum.wpi.edu" } ]
requires-python = ">=3.14"
dependencies = [
  "soco>=0.31.2",
  "ytmusicapi>=1.12.2",
]
[project.scripts]
library-radio = "youtube_music_library_radio.__main__:main"

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "deptry>=0.25.1",
  "mypy>=2.3.0",
  "pylint>=4.0.7",
  "pylint-per-file-ignores>=3.2.1",
  "pylint-pytest>=2.0.0a1",
  "pylint-venv>=3.0.4",
  "pyproject-fmt>=2.27.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "ruff>=0.16.2",
]

# Tool Configuration
[tool.ruff]
target-version = "py314"
line-length = 140
indent-width = 4
namespace-packages = [
  # Test directories are PEP 420 namespace packages (no __init__.py) because pytest runs under
  # --import-mode=importlib.
  "tests",
]
src = [ "src", "tests/fixtures" ]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "COM812", # Trailing comma missing - conflicts with formatter
  "CPY001", # Per-file copyright notice; the license is declared in LICENSE and pyproject
  "D203",   # 1 blank line before class (incompatible with D211)
  "D213",   # Multi-line docstring summary start on second line (incompatible with D212)
  "FIX002", # Allow TODO comments with author and link
  "ISC001", # Single-line-implicit-string-concatenation - conflicts with formatter
  "S311",   # Pseudo-random generators; this project shuffles a music library, not cryptography
]
[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  # Test files can use assert statements, magic values, access private members, and use late imports
  # to control import side effects around patches.
  "PLC0415",
  "PLR2004",
  "S101",
  "SLF001",
]

[tool.pylint]
jobs = 0  # Auto-detect CPU count
load-plugins = [
  "pylint.extensions.check_elif",
  "pylint.extensions.eq_without_hash",
  "pylint.extensions.redefined_loop_name",
  "pylint.extensions.typing",
  "pylint_per_file_ignores",
  "pylint_pytest",
]
[tool.pylint.basic]
good-names = [ "i", "j", "k", "v", "ex", "Run", "_", "id" ]
bad-names = [ "foo", "bar", "baz", "qux", "toto", "tutu", "tata" ]
[tool.pylint.design]
max-args = 5
max-locals = 15
max-attributes = 9  # Matches every field on the Settings dataclass
max-statements = 50
exclude-too-few-public-methods = [
  "argparse\\.Namespace",
  "logging\\.LogRecord",
  "typing\\.Protocol",
]
[tool.pylint.format]
max-line-length = 140
expected-line-ending-format = "LF"
# Allow long URLs/type comments to exceed line limit
ignore-long-lines = "^\\s*(# )?<?https?://\\S+>?$|\\s+# (type|pyright|pylint):"
[tool.pylint.MAIN]
init-hook = """
try: import pylint_venv
except ImportError: pass
else: pylint_venv.inithook()
"""
recursive = true
ignore = [ ".venv" ]
[tool.pylint.messages_control]
disable = [
  # https://github.com/astral-sh/ruff/issues/970
  # https://gist.github.com/rgant/60ba3dcaabdf85cae9d3dcdbbe4ae016#pylint-ruff-sync.sh
