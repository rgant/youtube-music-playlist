enable = [ "c-extension-no-member", "useless-suppression" ]
# Test files routinely access private members and use late imports for patching.
# redefined-outer-name: pytest fixtures shadow module-scope definitions by design.
# too-few-public-methods: a test fake stands in for one method of a real client; see
# "Test doubles" in CLAUDE.md for why a fake is preferred to a mock here.
per-file-ignores = [
  "**/tests/**/*.py:import-outside-toplevel,protected-access,too-few-public-methods,too-many-lines",
]
[tool.pylint.method_args]
timeout-methods = [
  "requests.api.delete",
  "requests.api.get",
  "requests.api.head",
  "requests.api.post",
  "requests.api.put",
]
[tool.pylint.string]
# Conflicts with ruff - ruff allows single quotes inside f-strings when outer string uses double quotes
check-quote-consistency = false

[tool.deptry]
known_first_party = [ "youtube_music_library_radio" ]

[tool.pyproject-fmt]
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
collapse_tables = [ "project.authors" ]

[tool.mypy]
# `stubs` holds this project's own local stub for `soco`, which ships no type information; see
# stubs/soco/__init__.pyi for why.
mypy_path = [ "src", "tests/fixtures", "stubs" ]
files = [ "src", "tests" ]
# tests/unit and tests/integration are PEP 420 namespace packages (no __init__.py), matching
# pytest's --import-mode=importlib and ruff's namespace-packages setting. Without these two
# options, mypy cannot tell "tests/unit/test_resolver.py" and "tests/integration/test_resolver.py"
# apart and reports a duplicate module name.
namespace_packages = true
explicit_package_bases = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = "ignore-without-code"
strict = true
show_column_numbers = true

[tool.pytest.ini_options]
# Show logs during test runs for better debugging
log_cli = false  # pytest -o log_cli=true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = [
  "--import-mode=importlib", # See: https://docs.pytest.org/en/stable/explanation/pythonpath.html#import-modes
  "--strict-config",         # Error on unknown configuration options
  "--strict-markers",        # Require all @pytest.mark.* decorators to be registered (prevents typos)
  "--tb=short",              # Shorter traceback format for cleaner output
  "-ra",                     # Show summary of all test outcomes (passed, failed, skipped, etc.)
]
testpaths = [ "tests" ]
# `tests/fixtures` holds test helpers, not tests. It is on the path so a test can import a helper
# by its plain module name.
pythonpath = [ "tests/fixtures" ]
filterwarnings = [
  "error", # Treat warnings as errors to catch issues early
]
markers = [
  "network: needs a live network connection; excluded from the default run via -m 'not network'",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
  "@overload",
  "pragma: no cover",
  # Matches both `if TYPE_CHECKING:` and this project's `if typing.TYPE_CHECKING:` spelling.
  "if (typing\\.)?TYPE_CHECKING:",
]
[tool.coverage.run]
branch = true
source = [ "src" ]
omit = [ "**/test_*.py", "**/tests/*" ]

[tool.basedpyright]
venv = ".venv"
venvPath = "."
# `stubs` holds this project's own local stub for `soco`, which ships no type information; see
# stubs/soco/__init__.pyi for why. This is basedpyright's analog of `[tool.mypy] mypy_path`.
stubPath = "stubs"
exclude = [
  "**/.*",
  "**/__pycache__",
  "node_modules",
]
# `tests/fixtures` matches `[tool.pytest.ini_options] pythonpath`, so a test helper resolves by its
# plain module name. This key turns off the automatic search of `src`, so `src` must appear here too.
extraPaths = [ "src", "tests/fixtures" ]
# Disabled because ruff's ISC001 is also ignored project-wide (it conflicts with the formatter).
# Both tools agree to not flag implicit string concatenation.
reportImplicitStringConcatenation = false
# Tests may access ``_underscored`` private members of the modules they exercise; this is the
# basedpyright analog of ruff's ``SLF001`` per-file-ignore for tests. Autouse pytest fixtures are
# never referenced by name, so basedpyright cannot see pytest's own runtime wiring to them.
executionEnvironments = [
  { root = "tests", reportPrivateUsage = "none", reportUnusedFunction = "none" },
]
